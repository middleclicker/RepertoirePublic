name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site/privacy _site/support
          cp index.html privacy.html support.html style.css script.js robots.txt sitemap.xml .nojekyll _site/
          cp -R assets _site/
          for page in privacy support; do
            sed -E 's@(href|src)="(index\.html|privacy\.html|support\.html|style\.css|assets/)@\1="../\2@g' "$page.html" > "_site/$page/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
